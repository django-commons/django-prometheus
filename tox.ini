[tox]
min_version = 4.4
envlist =
    {py310,py311,py312}-django420-{end2end,unittests}
    {py310,py311,py312,py313}-django{510,520}-{end2end,unittests}
    {py314,py314t}-django520-{end2end,unittests}
    {py312,py313,py314,py314t}-django600-{end2end,unittests}
    {py312,py313,py314,py314t,py315,py315t}-django610-{end2end,unittests}
    py310-lint
skip_missing_interpreters = True

[gh-actions]
python =
    3.10: py310, py310-lint
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314,py314t
    3.15: py315,py315t

[testenv]
deps =
    django420: Django>=4.2,<4.3
    django510: Django>=5.1,<5.2
    django520: Django>=5.2,<5.3
    django600: Django>=6.0,<6.1
    django610: Django>=6.1rc,<6.2
    coverage
    -rrequirements.txt
skip_missing_interpreters=true

changedir =
    end2end: {toxinidir}/django_prometheus/tests/end2end
setenv =
    end2end: PYTHONPATH = {toxinidir}
    end2end: DJANGO_SETTINGS_MODULE=testapp.settings
commands =
    end2end: coverage run --source=django_prometheus -m pytest testapp/
    unittests: coverage run --source=django_prometheus setup.py test
    unittests: python setup.py sdist bdist_wheel

[testenv:py310-lint]
deps =
    pre-commit==4.2.0
commands =
    pre-commit run --all-files
